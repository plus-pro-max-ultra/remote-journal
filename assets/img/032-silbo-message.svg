<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" aria-labelledby="t d"><title id="t">說話變成口哨，保留與改變的線索</title><desc id="d">西班牙語的詞語與句法沿用；平常說話的豐富頻率成分轉成口哨中的相對音高、轉折與中斷；理解需要練過聲音對應，也結合語句脈絡。</desc><rect width="640" height="500" rx="18" fill="#f2eee3"/><g font-family="Noto Sans CJK TC, sans-serif" fill="#234d41" text-anchor="middle"><text x="320" y="54" font-size="28">同樣的西班牙語詞語與句法</text><path d="M70 77 H570" stroke="#b8c6b5"/><rect x="28" y="110" width="250" height="190" rx="14" fill="#e0e6d8"/><rect x="362" y="110" width="250" height="190" rx="14" fill="#e9dfc9"/><text x="153" y="155" font-size="32">平常說話</text><text x="153" y="211" font-size="28">豐富的頻率成分</text><text x="153" y="257" font-size="28">音色等聲音線索</text><text x="487" y="155" font-size="32">換成口哨</text><text x="487" y="211" font-size="28">相對音高</text><text x="487" y="257" font-size="28">轉折與中斷</text><path d="M294 205 H343 M332 194 L343 205 L332 216" stroke="#a85833" fill="none" stroke-width="4"/><path d="M320 321 V352 M309 341 L320 352 L331 341" stroke="#a85833" fill="none" stroke-width="4"/><rect x="44" y="370" width="552" height="102" rx="14" fill="#234d41"/><text x="320" y="412" font-size="29" fill="#fffdf8">聽懂：練過的聲音對應</text><text x="320" y="453" font-size="28" fill="#fffdf8">＋ 語句脈絡</text></g></svg>