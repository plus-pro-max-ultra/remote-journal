name: Check Faraway Zine
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check content and draft structure
        run: python -m unittest discover -s tests -v
      - name: Build and validate published content
        run: python scripts/build_site.py
      - name: Check JavaScript syntax
        run: |
          node --check stories.js
          node --check sw.js
          python scripts/check_inline_js.py
